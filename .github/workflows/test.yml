name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: [18, 20]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: |
          node tests/parse.test.js
          node tests/semantic-engine.test.js
          node tests/product-engine.test.js
          node tests/render.test.js
          node tests/warnings.test.js

      - name: Verify renderer
        run: |
          for f in examples/*.mech; do
            node src/render.js "$f"
          done
